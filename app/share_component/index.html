<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
:root{--accent:#493a5c;--maxw:720px}
body{margin:0;font:14px system-ui;color:#777}
#row{display:flex;gap:14px;align-items:center;max-width:var(--maxw);margin:0 auto;box-sizing:border-box}
button,a{font:inherit;cursor:pointer;text-decoration:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:0;white-space:nowrap}
button{flex:1;padding:15px 0;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:1.5px;background:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:default}
a{width:50px;height:50px;padding:0;border-radius:999px;flex-shrink:0;background:#fff;border:1.5px solid var(--accent);color:var(--accent)}
button:active,a:active{opacity:.8}
#status{margin:14px 0 0;line-height:1.5;text-align:center}
</style>
<div id="row">
<button id="share" type="button">分享卡片</button>
<a id="save" download="简历罗盘分享卡.png" title="保存图片" aria-label="保存图片">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"/>
    <path d="M7 10l5 5 5-5"/>
    <path d="M5 21h14"/>
  </svg>
</a>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script>
let file, url;
const button=document.getElementById('share'),status=document.getElementById('status');
button.disabled=true;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
function sendHeight(){
  requestAnimationFrame(()=>send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)}));
}
// Match the share card's own width cap (min(720px, 65vh) of the REAL page, not this
// auto-sized iframe's tiny height) so the button row never stretches wider than the card
// on Streamlit's wide desktop layout.
function syncMaxWidth(){
  try{
    const vh=(window.parent&&window.parent.innerHeight)||window.innerHeight;
    document.documentElement.style.setProperty('--maxw',Math.min(720,vh*0.65)+'px');
  }catch(e){/* cross-origin fallback: keep the 720px default */}
  sendHeight();
}
try{window.parent.addEventListener('resize',syncMaxWidth);}catch(e){}
window.addEventListener('resize',syncMaxWidth);
window.addEventListener('message',event=>{
  if(event.source!==window.parent || event.data.type!=='streamlit:render')return;
  const encoded=event.data.args.png;
  if(event.data.args.color)document.documentElement.style.setProperty('--accent',event.data.args.color);
  if(!file){
    const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    file=new File([bytes],'简历罗盘分享卡.png',{type:'image/png'});
    url=URL.createObjectURL(file);
    document.getElementById('save').href=url;
    button.disabled=false;
  }
  sendHeight();
});
function sharingNavigator(){
  try {if(window.parent.navigator.canShare?.({files:[file]}))return window.parent.navigator;}catch(e){}
  try {if(navigator.canShare?.({files:[file]}))return navigator;}catch(e){}
  return null;
}
button.onclick=async()=>{
  const nav=sharingNavigator();
  button.disabled=true;
  let pending;
  try{
    // Invoke sharing during click activation, before notifying Python to rerun.
    if(nav)pending=nav.share({files:[file],title:'简历罗盘评估卡'});
  }catch(e){pending=Promise.reject(e);}
  // Unlock on the click itself, even if sharing is unsupported or cancelled.
  send('streamlit:setComponentValue',{value:true,dataType:'json'});
  try{
    if(pending){await pending;status.textContent='已交给系统分享，报告已解锁。';}
    else status.textContent='报告已解锁。当前浏览器不支持系统分享，可点击"保存图片"后分享。';
  }catch(e){status.textContent=e.name==='AbortError'?'已取消分享，报告已解锁。':'分享面板未能打开，报告已解锁，可保存图片后分享。';}
  finally{button.disabled=false;sendHeight();}
};
window.addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url);});
send('streamlit:componentReady',{apiVersion:1});
syncMaxWidth();
</script></html>
